[package]
name = "randbotd"
version = "3.3.0"
edition = "2021"
authors = ["The Random Consortium"]
description = "Random Consortium's Certificate Bot Daemon"
license = "MPL-2.0"
build = "build.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["serde"] }
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking"] }
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
igd = "0.12"
toml = "0.8"
hex = "0.4"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
webpki-roots = "0.25"
idna = "1.0"

[features]
default = []
full-suite = []

[package.metadata.deb]
maintainer = "The Random Consortium"
copyright = "2026, The Random Consortium <MPL-2.0>"
extended-description = "Decentralized Trust & Multi-Network SSL Authority Daemon"
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/randbotd", "usr/bin/randbotd", "755"],
    ["debian/randbotd.service", "lib/systemd/system/randbotd.service", "644"],
]
systemd-units = { unit-name = "randbotd" }
